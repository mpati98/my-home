version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: workspace_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workspace_pass}
      POSTGRES_DB:       ${POSTGRES_DB:-workspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workspace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Next.js App ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workspace_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-workspace}:${POSTGRES_PASSWORD:-workspace_pass}@db:5432/${POSTGRES_DB:-workspace}?schema=public
      NODE_ENV:     production
    ports:
      - "8080:3001"

volumes:
  postgres_data:
    name: workspace_postgres_data
